<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GR - Panthère — Générateur de fiches</title>
<style>
  :root[data-theme="light"]{
    --bg: #F7F8FA;
    --card: #FFFFFF;
    --card-border: #E7E9EE;
    --field-bg: #FBFBFC;
    --field-border: #E2E4EA;
    --field-border-focus: #10B981;
    --text: #14161B;
    --text-muted: #6B7280;
    --text-faint: #9AA0AC;
    --accent-a: #10B981;
    --accent-b: #F59E0B;
    --btn-text: #FFFFFF;
    --note-bg: #FFF8E9;
    --note-border: #F3DFA9;
    --note-text: #7A5B12;
    --preview-bg: #101215;
    --preview-text: #E7E9EE;
    --shadow: 0 1px 2px rgba(20,22,27,0.04), 0 8px 24px rgba(20,22,27,0.06);
    --error: #DC2626;
  }
  :root[data-theme="dark"]{
    --bg: #0B0D11;
    --card: #15171C;
    --card-border: #262932;
    --field-bg: #1B1E24;
    --field-border: #2C303A;
    --field-border-focus: #34D399;
    --text: #F2F3F5;
    --text-muted: #9AA0AC;
    --text-faint: #6B7280;
    --accent-a: #10B981;
    --accent-b: #F59E0B;
    --btn-text: #0B0D11;
    --note-bg: #221D10;
    --note-border: #4A3B12;
    --note-text: #E3C069;
    --preview-bg: #0A0B0D;
    --preview-text: #E7E9EE;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px rgba(0,0,0,0.4);
    --error: #F87171;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    transition: background .2s ease, color .2s ease;
  }

  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }

  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom: 32px;
  }

  .brand h1{
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .brand h1 span{
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand p{
    margin:0;
    font-size: 14px;
    color: var(--text-muted);
  }

  .theme-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 6px;
    box-shadow: var(--shadow);
    flex-shrink:0;
  }
  .theme-toggle button{
    width: 32px;
    height: 32px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text-faint);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .theme-toggle button svg{ width:16px; height:16px; }
  .theme-toggle button.active{
    background: var(--text);
    color: var(--card);
  }

  .card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .card-bar{
    height: 4px;
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
  }
  .card-body{ padding: 28px; }

  .eyebrow{
    font-size: 12px;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: 0.04em;
    margin: 0 0 20px;
  }

  .field{ margin-bottom: 18px; }
  .field-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 520px){
    .field-row{ grid-template-columns: 1fr; }
  }

  label{
    display:block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
  }
  label .optional{
    font-weight: 400;
    color: var(--text-faint);
  }

  input, textarea{
    width: 100%;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    outline: none;
    transition: border-color .15s ease;
  }
  input::placeholder, textarea::placeholder{ color: var(--text-faint); }
  input:focus, textarea:focus{ border-color: var(--field-border-focus); }
  textarea{ resize: vertical; min-height: 70px; line-height: 1.5; }

  .note{
    background: var(--note-bg);
    border: 1px solid var(--note-border);
    color: var(--note-text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12.5px;
    line-height: 1.5;
    margin-top: 4px;
  }

  .preview-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 14px;
  }
  .preview-head h2{
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }

  .copy-btn{
    display:flex;
    align-items:center;
    gap:6px;
    border:none;
    background: var(--text);
    color: var(--card);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    cursor:pointer;
    transition: opacity .15s ease, transform .1s ease;
  }
  .copy-btn:hover{ opacity: .88; }
  .copy-btn:active{ transform: scale(0.97); }
  .copy-btn svg{ width:14px; height:14px; }
  .copy-btn.copied{ background: var(--accent-a); color: #fff; }

  pre.preview{
    background: var(--preview-bg);
    color: var(--preview-text);
    border-radius: 12px;
    padding: 20px;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 13px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }
  pre.preview b{ font-weight: 700; }

  .reset-link{
    display:inline-block;
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--text-faint);
    text-decoration: none;
    cursor:pointer;
    background:none;
    border:none;
    font-family: inherit;
    padding:0;
  }
  .reset-link:hover{ color: var(--text-muted); text-decoration: underline; }

  footer{
    text-align:center;
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 8px;
  }

  /* Lock screen */
  #lock-screen{
    position: fixed;
    inset: 0;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 50;
    padding: 20px;
  }
  .lock-card{
    width: 100%;
    max-width: 340px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow:hidden;
    text-align:center;
  }
  .lock-icon{
    width: 44px;
    height: 44px;
    border-radius: 999px;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    display:flex;
    align-items:center;
    justify-content:center;
    margin: 28px auto 14px;
    color: var(--text-muted);
  }
  .lock-icon svg{ width:20px; height:20px; }
  .lock-card h2{
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .lock-card p{
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 20px;
  }
  .lock-body{ padding: 0 24px 28px; }
  #lock-input{
    text-align:center;
    letter-spacing: 0.3em;
    font-size: 18px;
    font-weight: 600;
  }
  #lock-error{
    color: var(--error);
    font-size: 12.5px;
    margin-top: 10px;
    min-height: 16px;
  }
  .lock-submit{
    width: 100%;
    margin-top: 14px;
    border:none;
    background: var(--text);
    color: var(--card);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 14px;
    border-radius: 10px;
    cursor:pointer;
  }
  .lock-submit:hover{ opacity: .9; }
  .lock-toggle{
    position:absolute;
    top: 20px;
    right: 20px;
  }

  #app{ display:none; }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="theme-toggle lock-toggle" role="group" aria-label="Choix du thème">
    <button id="lbtn-light" aria-label="Thème clair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="lbtn-dark" aria-label="Thème sombre">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <div class="lock-card">
    <div class="card-bar"></div>
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2>Accès protégé</h2>
    <p>Entre le code pour continuer</p>
    <div class="lock-body">
      <input id="lock-input" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
      <div id="lock-error"></div>
      <button class="lock-submit" id="lock-submit">Entrer</button>
    </div>
  </div>
</div>

<div id="app">
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <h1>GR - <span>Panthère</span></h1>
      <p>Générateur de fiches d'identification</p>
    </div>
    <div class="theme-toggle" role="group" aria-label="Choix du thème">
      <button id="btn-light" aria-label="Thème clair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="btn-dark" aria-label="Thème sombre">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-bar"></div>
    <div class="card-body">
      <p class="eyebrow">NOUVELLE FICHE</p>

      <div class="field-row">
        <div class="field">
          <label for="nom">Nom</label>
          <input id="nom" placeholder="ZAKI">
        </div>
        <div class="field">
          <label for="prenom">Prénom</label>
          <input id="prenom" placeholder="Toufik">
        </div>
      </div>

      <div class="field">
        <label for="poste">Poste suspecté</label>
        <input id="poste" placeholder="N/A">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="rattachement">Rattachement</label>
          <input id="rattachement" placeholder="Informateur pour le GR + groupe indé">
        </div>
        <div class="field">
          <label for="tel">Téléphone</label>
          <input id="tel" placeholder="3318255861">
        </div>
      </div>

      <div class="field">
        <label for="aide">Aide à l'identifications <span class="optional">(optionnel)</span></label>
        <input id="aide" placeholder="N/A">
      </div>

      <div class="field" style="margin-bottom:0;">
        <label for="infos">Infos complémentaires <span class="optional">(optionnel)</span></label>
        <textarea id="infos" placeholder="Observations, véhicule, complices..."></textarea>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="preview-head">
        <h2>Message généré</h2>
        <button class="copy-btn" id="copy-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span id="copy-label">Copier</span>
        </button>
      </div>
      <pre class="preview" id="preview"></pre>
      <button class="reset-link" id="reset-btn">Réinitialiser les champs</button>
    </div>
  </div>

  <footer>GR - Panthère — rien n'est stocké, tout reste sur cet écran</footer>

</div>
</div>

<script>
  const CODE = "0307";

  // --- Lock screen ---
  const lockScreen = document.getElementById('lock-screen');
  const app = document.getElementById('app');
  const lockInput = document.getElementById('lock-input');
  const lockError = document.getElementById('lock-error');
  const lockSubmit = document.getElementById('lock-submit');

  function tryUnlock(){
    if(lockInput.value.trim() === CODE){
      lockScreen.style.display = 'none';
      app.style.display = 'block';
    } else {
      lockError.textContent = 'Code incorrect';
      lockInput.value = '';
      lockInput.focus();
    }
  }
  lockSubmit.addEventListener('click', tryUnlock);
  lockInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });
  lockInput.addEventListener('input', () => { lockError.textContent = ''; });
  lockInput.focus();

  // --- Form / preview ---
  const ids = ['nom','prenom','poste','rattachement','tel','aide','infos'];
  const els = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
  const preview = document.getElementById('preview');

  function val(id, fallback){
    const v = els[id].value.trim();
    return v.length ? v : fallback;
  }

  function render(){
    const nom = val('nom', '').toUpperCase();
    const prenom = val('prenom', '');
    const nomPrenom = (nom || prenom) ? `${nom} ${prenom}`.trim() : 'N/A';
    const poste = val('poste', 'N/A');
    const rattachement = val('rattachement', 'N/A');
    const tel = val('tel', 'N/A');
    const aide = val('aide', 'N/A');
    const infos = els.infos.value.trim();
    const sep = '='.repeat(56);

    const lines = [
      `:alert: | FICHE NOM`,
      ``,
      `NOM Prénom : **${nomPrenom}**`,
      ``,
      `Poste suspecté : **${poste}**`,
      ``,
      `Rattachement : **${rattachement}**`,
      ``,
      `Tél : **${tel}**`,
      ``,
      `Aide à l'identifications : **${aide}**`,
      sep,
      `ℹ️ INFOS COMPLEMENTAIRES :`
    ];
    if(infos.length) lines.push(infos);

    preview.textContent = lines.join('\n');
  }

  ids.forEach(id => els[id].addEventListener('input', render));
  render();

  // Copy to clipboard
  const copyBtn = document.getElementById('copy-btn');
  const copyLabel = document.getElementById('copy-label');
  copyBtn.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(preview.textContent);
    }catch(e){
      const range = document.createRange();
      range.selectNode(preview);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
    }
    copyBtn.classList.add('copied');
    copyLabel.textContent = 'Copié !';
    setTimeout(() => {
      copyBtn.classList.remove('copied');
      copyLabel.textContent = 'Copier';
    }, 1500);
  });

  // Reset
  document.getElementById('reset-btn').addEventListener('click', () => {
    ids.forEach(id => els[id].value = '');
    render();
  });

  // Theme toggle (synced between lock screen and app)
  const root = document.documentElement;
  const toggles = [
    [document.getElementById('btn-light'), document.getElementById('btn-dark')],
    [document.getElementById('lbtn-light'), document.getElementById('lbtn-dark')]
  ];

  function setTheme(theme){
    root.setAttribute('data-theme', theme);
    toggles.forEach(([l, d]) => {
      l.classList.toggle('active', theme === 'light');
      d.classList.toggle('active', theme === 'dark');
    });
  }

  toggles.forEach(([l, d]) => {
    l.addEventListener('click', () => setTheme('light'));
    d.addEventListener('click', () => setTheme('dark'));
  });

  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(prefersDark ? 'dark' : 'light');
</script>

</body>
</html>
